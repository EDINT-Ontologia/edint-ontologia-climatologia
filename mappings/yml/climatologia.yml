    s: https://example.org/recurso/resultadoObservacion/meteorologia/$(_id)/windSpeed
    po:
      - [a, qudt:QuantityValue]
      - [qudt:value, $(windSpeed)]
#      - [qudt:unit, unit:KiloM-PER-HR]

